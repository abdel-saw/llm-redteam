<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}LLM-RT — Red Teaming pour LLM{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <link rel="stylesheet" href="/static/css/app.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#c8102e',
            'primary-dark': '#9c0c23',
            'midnight': '#0a1929',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
          },
        },
      },
    };
  </script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen flex flex-col">
  <header class="bg-midnight text-white">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <a href="/" class="flex items-baseline gap-2">
        <span class="text-xl font-bold tracking-tight">LLM-RT</span>
        <span class="text-xs text-gray-400 hidden sm:inline">Red Teaming for LLM Apps</span>
      </a>
      <nav class="space-x-6 text-sm">
        <a href="/" class="hover:text-primary transition">Accueil</a>
        <a href="/history" class="hover:text-primary transition">Historique</a>
        <a href="/docs" class="hover:text-primary transition">API</a>
      </nav>
    </div>
  </header>
  <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full">
    {% block content %}{% endblock %}
  </main>
  <footer class="border-t border-gray-200 py-6 bg-white">
    <div class="max-w-6xl mx-auto px-4 text-sm text-gray-500 flex justify-between flex-wrap gap-2">
      <span>LLM-RT &mdash; PFE Master RSI, FST Settat</span>
      <a href="https://github.com/abdel-saw/llm-redteam" class="hover:text-primary">github.com/abdel-saw/llm-redteam</a>
    </div>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
