[pytest]
asyncio_mode = strict
testpaths = backend/tests
pythonpath = .
addopts = -v --tb=short
filterwarnings =
    ignore::DeprecationWarning
markers =
    live: tests that hit a real LLM provider (Groq / OpenRouter). Skipped in CI (`pytest -m "not live"`). None registered yet — all production tests mock httpx via respx.
